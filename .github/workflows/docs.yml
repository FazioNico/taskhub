# Met à jour la documentation d'API avec Claude Code et ouvre une Pull Request (section 6.3)
# Secret requis : ANTHROPIC_API_KEY
name: docs
on:
  push:
    branches: [main]
    paths: ["src/routes/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Mise à jour de la doc
        run: >
          claude -p "Mets à jour docs/api.md et docs/openapi.yaml pour refléter exactement
          les routes de src/routes/. Ne modifie aucun autre fichier."
          --allowedTools "Read,Edit,Write,Glob,Grep"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/auto-update
          title: "docs: mise à jour automatique de la documentation d'API"
          body: "PR générée par Claude Code. À relire avant merge."
